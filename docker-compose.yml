services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azorsuite_api
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: azorsuite_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: azor_suite
      MYSQL_USER: azor
      MYSQL_PASSWORD: azor_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - azorsuite_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: azorsuite_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  azorsuite_mysql_data: